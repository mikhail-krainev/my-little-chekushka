name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: one runner per CPU, each packs the Electron it has installed (no extra download that can 504)
          - { os: macos-latest, script: dist:mac, name: macos-arm64, args: '--arm64 -c.electronDist=node_modules/electron/dist -c.electronVersion=45.2.3' }
          - { os: macos-15-intel, script: dist:mac, name: macos-x64, args: '--x64 -c.electronDist=node_modules/electron/dist -c.electronVersion=45.2.3' }
          - { os: windows-latest, script: dist:win, name: windows, args: '' }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      # GitHub release downloads (Electron binaries) sometimes answer 504: retry a few times
      - name: Package
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            npm run ${{ matrix.script }} -- --publish never ${{ matrix.args }} && exit 0
            echo "attempt $attempt failed, retrying"; sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: chekushka-${{ matrix.name }}
          path: |
            app/dist/*.pkg
            app/dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      - run: npm test

  package:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          # one macOS runner packs both arm64 and x64 .pkg (arch list in package.json)
          - { os: macos-latest, script: dist:mac, name: macos }
          - { os: windows-latest, script: dist:win, name: windows }
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: npm ci
      # GitHub release downloads (Electron, NSIS) sometimes answer 504 for a long time.
      # First attempts go to GitHub; later ones use the npmmirror.com copy.
      - name: Package
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if [ "$attempt" -ge 3 ]; then
              export ELECTRON_MIRROR=https://npmmirror.com/mirrors/electron/
              export ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
              echo "using npmmirror.com"
            fi
            npm run ${{ matrix.script }} -- --publish never && exit 0
            echo "attempt $attempt failed, retrying"; sleep 20
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: chekushka-${{ matrix.name }}
          path: |
            app/dist/*.pkg
            app/dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

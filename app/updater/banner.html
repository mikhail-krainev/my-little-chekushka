<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Обновление</title>
  <link rel="stylesheet" href="../ui/pixel.css">
  <style>
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
    .card { margin: 6px 12px 12px 6px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; }
    .px-sprite { width: 40px; height: 64px; margin-top: 2px; }
    .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
    .card.error .px-title { color: var(--red-dark); }
    .card.error .px-title::before { background: var(--red); }
    .buttons { margin-top: 4px; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .buttons:empty { display: none; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card px-panel" id="card">
    <img class="px-sprite" src="../assets/sprites/body.png" alt="">
    <div class="body">
      <div class="px-title" id="title"></div>
      <div class="px-text" id="text"></div>
      <div class="px-bar" id="bar" hidden><div id="fill"></div></div>
      <div class="buttons" id="buttons"></div>
    </div>
  </div>
  <script src="./banner-view.js"></script>
</body>
</html>

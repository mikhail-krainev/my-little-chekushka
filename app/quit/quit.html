<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>Выход</title>
  <link rel="stylesheet" href="../ui/pixel.css">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; }
    /* dimmed screen with a coarse dither, like the scene behind a pixel-game dialog */
    body { background: repeating-conic-gradient(rgba(14, 12, 12, .42) 0 25%, rgba(14, 12, 12, .34) 0 50%) 0 0 / 4px 4px; }
    .card {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 400px; padding: 16px 18px;
      display: flex; gap: 14px; align-items: flex-end;
    }
    .px-sprite { width: 81px; height: 130px; }
    .body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; align-self: stretch; }
    .px-bubble { flex: 1; display: flex; align-items: center; min-height: 64px; }
    .buttons { display: flex; justify-content: flex-end; }
    #quit { position: absolute; left: 0; top: 0; margin: 0; will-change: transform; }
    #quit.tired { filter: saturate(.6) brightness(.95); }
  </style>
</head>
<body>
  <div class="card px-panel">
    <img class="px-sprite" src="../assets/sprites/body.png" alt="">
    <div class="body">
      <div class="px-title">Уже уходишь?</div>
      <div class="px-bubble" id="text">Попробуй поймать кнопку «Выйти».</div>
      <div class="buttons"><button id="stay" class="px-btn primary" type="button">Остаться</button></div>
    </div>
  </div>
  <button id="quit" class="px-btn danger" type="button" tabindex="-1">Выйти</button>
  <script type="module" src="./quit-view.mjs"></script>
</body>
</html>
